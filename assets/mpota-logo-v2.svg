  <!-- Full name below, kept as plain text rather than a button -->
  <text x="700" y="1175" text-anchor="middle" fill="#0B3F62" font-family="Avenir Next, Montserrat, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="2">Municipal Parks On The Air</text>
  <text x="700" y="1230" text-anchor="middle" fill="#6B7774" font-family="Avenir Next, Montserrat, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="3">CITY GREENSPACE • COMMUNITY • CONNECTION</text>
</svg>
