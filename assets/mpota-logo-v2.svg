<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" role="img" aria-labelledby="title desc">
  <title id="title">MPOTA — Municipal Parks On The Air</title>
  <desc id="desc">A bordered MPOTA logo in deep civic blue, with the acronym above a city skyline and central urban park emblem, and the full name Municipal Parks On The Air below.</desc>

  <defs>
    <clipPath id="park-window-v2">
      <rect x="112" y="132" width="596" height="596" rx="104"/>
    </clipPath>
  </defs>

  <!-- Second border around the complete text-and-mark lockup -->
  <rect x="70" y="55" width="1260" height="1230" rx="108" fill="#FFF7E8" stroke="#0B3F62" stroke-width="24"/>

  <!-- Top wordmark -->
  <text x="700" y="225" text-anchor="middle" fill="#243136" font-family="Avenir Next, Montserrat, Arial, sans-serif" font-size="170" font-weight="800" letter-spacing="7">MP<tspan fill="#2E7D5B">O</tspan>TA</text>

  <!-- Original urban-park emblem, centered -->
  <g transform="translate(320 255)">
    <rect x="60" y="80" width="700" height="700" rx="148" fill="#0B3F62"/>
    <rect x="112" y="132" width="596" height="596" rx="104" fill="#FFF7E8"/>

    <g clip-path="url(#park-window-v2)">
      <!-- Connection / airwaves -->
      <path d="M282 238 C343 169 477 169 538 238" fill="none" stroke="#F2A12C" stroke-width="24" stroke-linecap="round"/>
      <path d="M330 286 C373 238 447 238 490 286" fill="none" stroke="#F2A12C" stroke-width="24" stroke-linecap="round"/>

      <!-- Urban skyline -->
      <g fill="#243136">
        <path d="M130 555V430h68v-70h58v195z"/>
        <path d="M224 555V338h103v-38h34v255z"/>
        <path d="M348 555V266h106v-34h26v323z"/>
        <path d="M466 555V362h92v-30h34v223z"/>
        <path d="M570 555V306h94v249z"/>
        <path d="M634 555V394h74v161z"/>
      </g>

      <!-- Building details -->
      <g fill="#FFF7E8">
        <rect x="153" y="452" width="16" height="18" rx="2"/><rect x="191" y="452" width="16" height="18" rx="2"/>
        <rect x="153" y="492" width="16" height="18" rx="2"/><rect x="191" y="492" width="16" height="18" rx="2"/>
        <rect x="250" y="375" width="18" height="20" rx="2"/><rect x="289" y="375" width="18" height="20" rx="2"/>
        <rect x="250" y="417" width="18" height="20" rx="2"/><rect x="289" y="417" width="18" height="20" rx="2"/>
        <rect x="250" y="459" width="18" height="20" rx="2"/><rect x="289" y="459" width="18" height="20" rx="2"/>
        <rect x="380" y="309" width="18" height="23" rx="2"/><rect x="419" y="309" width="18" height="23" rx="2"/>
        <rect x="380" y="354" width="18" height="23" rx="2"/><rect x="419" y="354" width="18" height="23" rx="2"/>
        <rect x="380" y="399" width="18" height="23" rx="2"/><rect x="419" y="399" width="18" height="23" rx="2"/>
        <rect x="504" y="405" width="18" height="20" rx="2"/><rect x="544" y="405" width="18" height="20" rx="2"/>
        <rect x="504" y="446" width="18" height="20" rx="2"/><rect x="544" y="446" width="18" height="20" rx="2"/>
        <rect x="600" y="348" width="18" height="20" rx="2"/><rect x="640" y="348" width="18" height="20" rx="2"/>
        <rect x="600" y="389" width="18" height="20" rx="2"/><rect x="640" y="389" width="18" height="20" rx="2"/>
      </g>

      <!-- Park canopy and landscape -->
      <path d="M112 574 C182 533 238 532 295 560 C344 529 418 531 470 562 C523 532 601 536 708 576V760H112Z" fill="#6DB34D"/>
      <path d="M112 640 C210 607 278 610 359 643 C445 610 554 610 708 650V760H112Z" fill="#2E7D5B"/>
      <path d="M384 760 C423 713 449 685 466 654 C482 625 489 596 481 569 C498 597 503 628 498 654 C493 681 477 713 457 760Z" fill="#0B3F62"/>
      <path d="M469 622 C431 599 406 565 407 534 C434 544 456 562 469 591 C472 560 487 537 514 520 C519 553 502 589 469 622Z" fill="#0B3F62"/>
      <path d="M471 598 C490 554 518 531 555 523 C550 559 524 592 471 618Z" fill="#0B3F62"/>
      <path d="M142 721 C285 687 421 686 708 718V760H112Z" fill="#FFF7E8" opacity="0.96"/>
      <path d="M394 760 C421 731 435 708 451 686 C469 663 489 651 518 639 C492 678 481 721 479 760Z" fill="#F2A12C"/>

      <!-- Small public-space cues -->
      <g fill="#243136">
        <path d="M570 667h89v12h-89zM579 681h71v8h-71zM584 689v31h9v-31zM638 689v31h9v-31z"/>
        <path d="M617 575h10v77h-10zM600 574h44l-8-18h-28z"/>
