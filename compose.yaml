services:
  postgres:
    # postgis/postgis:16-3.5 currently publishes amd64 only.
    platform: linux/amd64
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: mpota
      POSTGRES_USER: mpota
      POSTGRES_PASSWORD: mpota
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpota -d mpota"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-migrate:
    platform: linux/amd64
    image: postgis/postgis:16-3.5
    environment:
      PGPASSWORD: mpota
    command: ["sh", "-c", "set -e; psql -h postgres -U mpota -d mpota -f /migrations/002_park_images.sql; psql -h postgres -U mpota -d mpota -f /migrations/003_qso_validation.sql; psql -h postgres -U mpota -d mpota -f /migrations/004_qso_frequency.sql; psql -h postgres -U mpota -d mpota -f /migrations/005_hunter_attribution_and_retirement.sql"]
    volumes:
      - ./infra/db:/migrations:ro
    depends_on:
      postgres: { condition: service_healthy }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    ports: ["4222:4222", "8222:8222"]

  minio:
    # Quay's current manifest is not resolved as linux/arm64/v8 by some
    # Docker Desktop versions; Docker Desktop will emulate amd64 locally.
    platform: linux/amd64
    image: quay.io/minio/minio@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio-data:/data

  keycloak:
    # Keep local startup compatible with Docker Desktop ARM64 resolver versions.
    platform: linux/amd64
    image: quay.io/keycloak/keycloak@sha256:e5e169f6ef82b06d2f5b08e9ac80e6a6335900360f0767e04d6810a9b4bc3590
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8081:8080"]

  tile-bootstrap:
    profiles: ["self-hosted-tiles"]
    image: alpine:3.22
    environment:
      MPOTA_TILESET_URL: ${MPOTA_TILESET_URL:-}
      MPOTA_TILESET_FILE: ${MPOTA_TILESET_FILE:-mpota.mbtiles}
      MPOTA_TILESET_SOURCE_FILE: ${MPOTA_TILESET_SOURCE_FILE:-europe-latest.osm.pbf}
      MPOTA_TILESET_SHA256: ${MPOTA_TILESET_SHA256:-}
      MPOTA_TILESET_REQUIRED: ${MPOTA_TILESET_REQUIRED:-false}
      MPOTA_TILESET_FORCE_REFRESH: ${MPOTA_TILESET_FORCE_REFRESH:-false}
    command:
      - /bin/sh
      - -c
      - apk add --no-cache ca-certificates curl && exec /bootstrap/bootstrap.sh
    volumes:
      - mpota-tile-data:/data
      - ./infra/tiles/bootstrap-pbf.sh:/bootstrap/bootstrap.sh:ro

  tile-build:
    profiles: ["self-hosted-tiles"]
    image: ghcr.io/systemed/tilemaker:master
    environment:
      MPOTA_TILESET_URL: ${MPOTA_TILESET_URL:-}
      MPOTA_TILESET_FILE: ${MPOTA_TILESET_FILE:-europe.mbtiles}
      MPOTA_TILESET_SOURCE_FILE: ${MPOTA_TILESET_SOURCE_FILE:-europe-latest.osm.pbf}
      MPOTA_TILESET_FORCE_REFRESH: ${MPOTA_TILESET_FORCE_REFRESH:-false}
    entrypoint: ["/bin/sh", "/bootstrap/build-mbtiles.sh"]
    volumes:
      - mpota-tile-data:/data
      - ./infra/tiles/build-mbtiles.sh:/bootstrap/build-mbtiles.sh:ro
    depends_on:
      tile-bootstrap: { condition: service_completed_successfully }

  tileserver:
    profiles: ["self-hosted-tiles"]
    # TileServer GL is also run as amd64 on Apple Silicon when ARM resolution
    # is unavailable; production already targets linux/amd64.
    platform: linux/amd64
    image: maptiler/tileserver-gl@sha256:f5f954587478ca6be606f834fba1880b5ddd9c958132ded79a573bc1790a8bf0
    ports: ["8080:8080"]
    volumes:
      - mpota-tile-data:/data:ro
    depends_on:
      tile-build: { condition: service_completed_successfully }

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://mpota:mpota@postgres:5432/mpota
      JWT_SECRET: dev-only-change-me
      AUTH_MODE: local
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-MPOTA Administrator}
      BOOTSTRAP_ADMIN_CALLSIGN: ${BOOTSTRAP_ADMIN_CALLSIGN:-}
      BOOTSTRAP_ADMIN_LOCALE: ${BOOTSTRAP_ADMIN_LOCALE:-en}
      GEOCODER_URL: ${GEOCODER_URL:-https://nominatim.openstreetmap.org/reverse}
      GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:-MPOTA/0.1 (configure contact address)}
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_BUCKET: mpota
      S3_PARK_IMAGES_BUCKET: mpota-park-images
      PARK_IMAGE_MAX_BYTES: ${PARK_IMAGE_MAX_BYTES:-10485760}
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      db-migrate: { condition: service_completed_successfully }
      nats: { condition: service_started }
      minio: { condition: service_started }

  award-worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://mpota:mpota@postgres:5432/mpota
      NATS_URL: nats://nats:4222
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_started }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api/v1
        VITE_TILE_URL: ${VITE_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  postgres-data:
  minio-data:
  mpota-tile-data:
