<svg xmlns="http://www.w3.org/2000/svg" width="820" height="820" viewBox="0 0 820 820" role="img" aria-labelledby="title desc">
  <title id="title">Retired MPOTA park marker</title>
  <desc id="desc">The MPOTA park marker shown in grayscale with a red diagonal retirement bar.</desc>
  <defs>
    <filter id="retired-grey" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.72" /></feComponentTransfer>
    </filter>
  </defs>
  <image href="/mpota-marker.svg" x="0" y="0" width="820" height="820" preserveAspectRatio="xMidYMid meet" filter="url(#retired-grey)" />
  <path d="M122 698 L698 122" stroke="#FFFDF9" stroke-width="74" stroke-linecap="round" opacity=".96" />
  <path d="M122 698 L698 122" stroke="#B3261E" stroke-width="48" stroke-linecap="round" />
</svg>
