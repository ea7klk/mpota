apiVersion: v1
kind: ConfigMap
metadata:
  name: mpota-tile-bootstrap
data:
  MPOTA_TILESET_URL: https://btrfs.openfreemap.com/areas/planet/20260906_080001_pt/tiles.mbtiles
  MPOTA_TILESET_FILE: mpota.mbtiles
  MPOTA_TILESET_SHA256: ca0b8f9a510563a1ccef9caeb55269285f112fb7b7cca4b371c8826bf722ea14
  MPOTA_TILESET_REQUIRED: "true"
  MPOTA_TILESET_FORCE_REFRESH: "false"
  bootstrap.sh: |
    #!/bin/sh
    set -eu

    data_dir=${MPOTA_TILE_DATA_DIR:-/data}
    tile_file=${MPOTA_TILESET_FILE:-mpota.mbtiles}
    tile_url=${MPOTA_TILESET_URL:-}
    tile_sha256=${MPOTA_TILESET_SHA256:-}
    required=${MPOTA_TILESET_REQUIRED:-false}
    force_refresh=${MPOTA_TILESET_FORCE_REFRESH:-false}
    target="${data_dir}/${tile_file}"
    manifest="${target}.manifest"

    case "${tile_file}" in
      ""|/*|*/*|.*)
        echo "MPOTA_TILESET_FILE must be a simple file name" >&2
        exit 1
        ;;
    esac

    mkdir -p "${data_dir}"

    if [ -s "${target}" ] && [ "${force_refresh}" != "true" ]; then
      echo "Tile set already present at ${target}; leaving it unchanged."
      exit 0
    fi

    if [ -z "${tile_url}" ]; then
      if [ "${required}" = "true" ]; then
        echo "MPOTA_TILESET_URL is required but is not configured" >&2
        exit 1
      fi
      echo "No tile set URL configured; bootstrap skipped."
      exit 0
    fi

    tmp="${target}.part"
    progress_pipe="${tmp}.progress"
    trap 'rm -f "${tmp}" "${progress_pipe}"' EXIT INT TERM

    rm -f "${progress_pipe}"
    mkfifo "${progress_pipe}"

    echo "Downloading MPOTA tile set from ${tile_url}"
    curl --fail --location --show-error --progress-bar \
      --retry 5 --retry-delay 5 --connect-timeout 20 \
      --output "${tmp}" "${tile_url}" 2>"${progress_pipe}" &
    curl_pid=$!
    next_percent=5

    tr '\r' '\n' < "${progress_pipe}" | while IFS= read -r progress_line; do
      percent=$(printf '%s\n' "${progress_line}" | sed -n 's/.* \([0-9][0-9]*\)\.[0-9][0-9]*%.*/\1/p')
      if [ -n "${percent}" ]; then
        while [ "${percent}" -ge "${next_percent}" ] && [ "${next_percent}" -le 100 ]; do
          echo "Tile set download progress: ${next_percent}%"
          next_percent=$((next_percent + 5))
        done
      elif [ -n "${progress_line}" ]; then
        echo "Tile set download: ${progress_line}"
      fi
    done

    curl_status=0
    wait "${curl_pid}" || curl_status=$?
    if [ "${curl_status}" -ne 0 ]; then
      echo "Tile set download failed with exit code ${curl_status}" >&2
      exit "${curl_status}"
    fi
    test -s "${tmp}"

    if [ -n "${tile_sha256}" ]; then
      echo "${tile_sha256}  ${tmp}" | sha256sum --check --status
    fi

    mv -f "${tmp}" "${target}"
    {
      printf 'url=%s\n' "${tile_url}"
      printf 'sha256=%s\n' "${tile_sha256}"
      printf 'downloaded_at=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
    } > "${manifest}"

    echo "Tile set is ready at ${target}"
