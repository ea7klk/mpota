apiVersion: apps/v1
kind: Deployment
metadata:
  name: mpota-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: mpota-api }
  template:
    metadata:
      labels: { app: mpota-api }
    spec:
      containers:
        - name: api
          image: ghcr.io/ea7klk/mpota-api:dev
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: mpota-config }
            - secretRef: { name: mpota-secrets }
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 3000 }
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 3000 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: mpota-api
spec:
  selector: { app: mpota-api }
  ports: [{ port: 3000, targetPort: 3000 }]
