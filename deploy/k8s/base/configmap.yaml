apiVersion: v1
kind: ConfigMap
metadata:
  name: mpota-config
data:
  NODE_ENV: production
  AUTH_MODE: keycloak
  KEYCLOAK_JWKS_URL: https://auth.example.org/realms/mpota/protocol/openid-connect/certs
  KEYCLOAK_ISSUER: https://auth.example.org/realms/mpota
  KEYCLOAK_AUDIENCE: mpota-api
  PORT: "3000"
  NATS_URL: nats://nats:4222
  REDIS_URL: redis://redis:6379
  S3_REGION: us-east-1
  S3_BUCKET: mpota
  S3_PARK_IMAGES_BUCKET: mpota-park-images
  PARK_IMAGE_MAX_BYTES: "10485760"
  S3_ENDPOINT: http://minio:9000
---
apiVersion: v1
kind: Secret
metadata:
  name: mpota-secrets
type: Opaque
stringData:
  DATABASE_URL: replace-with-secret-manager-reference
  JWT_SECRET: replace-with-secret-manager-reference
  S3_ACCESS_KEY: replace-with-secret-manager-reference
  S3_SECRET_KEY: replace-with-secret-manager-reference
