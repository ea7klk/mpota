apiVersion: apps/v1
kind: Deployment
metadata:
  name: mpota-web
spec:
  replicas: 2
  selector:
    matchLabels: { app: mpota-web }
  template:
    metadata:
      labels: { app: mpota-web }
    spec:
      containers:
        - name: web
          image: ghcr.io/ea7klk/mpota-web:dev
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mpota-web
spec:
  selector: { app: mpota-web }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mpota
spec:
  rules:
    - host: mpota.example.org
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: mpota-api, port: { number: 3000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: mpota-web, port: { number: 80 } } }
