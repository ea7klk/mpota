apiVersion: apps/v1
kind: Deployment
metadata:
  name: mpota-tileserver
spec:
  replicas: 1
  selector:
    matchLabels: { app: mpota-tileserver }
  template:
    metadata:
      labels: { app: mpota-tileserver }
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: tileserver
          image: maptiler/tileserver-gl:latest
          ports: [{ containerPort: 8080 }]
          volumeMounts: [{ name: tiles, mountPath: /data }]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 2000m, memory: 4Gi }
      volumes:
        - name: tiles
          persistentVolumeClaim: { claimName: mpota-tiles }
---
apiVersion: v1
kind: Service
metadata:
  name: mpota-tileserver
spec:
  selector: { app: mpota-tileserver }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mpota-tiles
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 100Gi }
